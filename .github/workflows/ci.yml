name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Studio plugin static checks (Linux)
        if: runner.os == 'Linux'
        run: python3 scripts/check-studio-plugin.py
      - name: Studio plugin static checks (Windows)
        if: runner.os == 'Windows'
        run: python scripts/check-studio-plugin.py
      - name: Parse Windows scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          [scriptblock]::Create((Get-Content -Raw scripts/install.ps1)) | Out-Null
          [scriptblock]::Create((Get-Content -Raw scripts/install-local-runtime.ps1)) | Out-Null
          [scriptblock]::Create((Get-Content -Raw scripts/start-local-ai.ps1)) | Out-Null
          [scriptblock]::Create((Get-Content -Raw scripts/test-local-ai.ps1)) | Out-Null
          Write-Host "Windows installer and local AI scripts parsed successfully"
      - name: Check
        run: cargo check --workspace --all-targets
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
